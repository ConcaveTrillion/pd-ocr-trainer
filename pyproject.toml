[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-ocr-trainer"
version = "0.1.5"
description = "OCR training suite for PGDP documents with NiceGUI interface"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    {name = "ConcaveTrillion", email = "ConcaveTrillion@gmail.com"}
]
license = "Unlicense"
keywords = ["OCR", "training", "deep-learning", "pytorch", "text-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "python-doctr>=0.11.1a0",
    "nicegui>=1.4.0",
    "matplotlib>=3.10.1",
    "pd-book-tools",
]

[project.optional-dependencies]
jupyter = [
    "jupyterlab>=4.0",
    "ipykernel",
    "ipywidgets",
]
quality = [
    "ruff>=0.15.11",
    "pre-commit>=4.2.0",
    "isort>=6.0",
]
test = [
    "pytest>=8.3",
    "pytest-xdist>=3.0",
    "playwright>=1.54.0",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-xdist>=3.0",
    "playwright>=1.54.0",
]
lint = [
    "ruff>=0.15.11",
    "pre-commit>=4.2.0",
    "isort>=6.0",
]
jupyter = [
    "jupyterlab>=4.0",
    "ipykernel",
    "ipywidgets",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "jupyter"},
]
all-dev = [
    {include-group = "dev"},
]

[project.scripts]
pd-ocr-trainer-recog = "pd_ocr_trainer.train_recog:main"
pd-ocr-trainer-detect = "pd_ocr_trainer.train_detect:main"
pd-ocr-trainer-ui = "pd_ocr_trainer.ui:main"

[tool.uv.sources]
pd-book-tools = { git = "https://github.com/ConcaveTrillion/pd-book-tools.git" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "browser: browser-based UI regression tests",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # ruff-specific rules
    "ERA",    # eradicate (commented-out code)
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# CLI scripts and fixture scripts — print() is the output mechanism
"scripts/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["pd_ocr_trainer"]

[tool.ruff.format]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"

[[tool.pyright.executionEnvironments]]
root = "src"
typeCheckingMode = "strict"
